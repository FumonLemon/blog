baseURL: "https://blog.lemonfumo.top/"
theme: "hugo-bearneo"
title: "LemonFumo"
locale: "zh-cn"
defaultContentLanguage: "zh"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

disableKinds: []
ignoreErrors: ["error-disable-taxonomy"]

permalinks:
  page: "/:sections/:slug/"

params:
  title: "LemonFumo"
  description: "记录学习、思考与写作。"
  favicon: "/logo.png"
  images: ["/logo.png"]
  copyright: "Copyright © 2026, LemonFumo."
  dateFormat: "2006-01-02"

  groupByYear: false
  showPostCount: false
  postSearch: true
  toc: true
  imageZoom: true
  externalLinksNewTab: true

  upvote: false

  footer:
    hideCopyright: false
    hideSitemap: false
    hideMadeWithLine: false
    hideRSSAndEmail: false

  RSS:
    enableRSS: true
    pageLimit: 20

  author:
    name: "LemonFumo"
    email: "chat@fumolemon.com"

mainSections: ["posts"]

taxonomies:
  tag: tags

menu:
  main:
    - name: "关于"
      url: "about/"
      weight: 10

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 3
